<!DOCTYPE html>
<html>
<head>
    <title>View Caretaker Requests</title>

    <style>
        body{ font-family: Arial; background-color:#f4f6f9; }
        h2{ text-align:center; margin-top:20px; }
        table{ width:90%; margin:auto; border-collapse:collapse; background:white; }
        th,td{ padding:12px; text-align:center; border:1px solid #ddd; }
        th{ background:#007bff; color:white; }
        tr:nth-child(even){ background:#f2f2f2; }
        tr:hover{ background:#e6f2ff; }
        select, button{ padding:5px; margin:2px; }
    </style>

</head>
<body>

<h2>CareTaker Requests</h2>

<table>
<tr>
    <th>Sl No</th>
    <th>Patient Name</th>
    <th>Date</th>
    <th>Time</th>
    <th>Status</th>
    <th>Assign Caretaker</th>
</tr>

{% for i in data %}
<tr>
    <td>{{forloop.counter}}</td>
    <td>{{i.PATIENT.name}}</td>
    <td>{{i.date}}</td>
    <td>{{i.time}}</td>
    <td>{{i.reply}}</td>
    <td>
        {% if i.reply != "assigned" %}
        <form method="POST" action="/myapp/assign_caretaker/{{ i.id }}">
            {% csrf_token %}
            <select name="caretaker_id" required>
                <option value="">Select Caretaker</option>
                {% for c in caretakers %}
                    <option value="{{c.id}}">{{c.name}}</option>
                {% endfor %}
            </select>
            <button type="submit">Assign</button>
        </form>
        {% else %}
            Assigned
        {% endif %}
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
