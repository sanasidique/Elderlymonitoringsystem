<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elderly Care Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            overflow: hidden;
        }

        .split-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Side - 50% */
        .left-side {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?q=80&w=2070') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .left-side::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.4), rgba(15, 23, 42, 0.7));
        }

        .left-content {
            position: relative;
            z-index: 10;
            color: white;
            max-width: 500px;
        }

        .left-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        /* Right Side - 50% */
        .right-side {
            flex: 1;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-container {
            width: 100%;
            max-width: 450px; /* Slightly wider to accommodate larger font */
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h2 {
            color: black;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        /* INCREASED LABEL FONT SIZE */
        .form-group label {
            display: block;
            color: black;
            margin-bottom: 12px;
            font-size: 1.2rem; /* Was 0.9rem */
            font-weight: 500;
        }

        /* INCREASED INPUT FONT SIZE */
        .form-group input {
            width: 100%;
            padding: 16px 20px; /* Increased padding for better balance */
            background: #334155;
            border: 2px solid #475569; /* Slightly thicker border */
            border-radius: 10px;
            color: white;
            font-size: 1.15rem; /* Increased font size */
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0f766e;
            background: #1e293b;
        }

        .options-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: black;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background-color: #0f766e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .login-button:hover {
            background-color: #0f766e;
        }

        @media (max-width: 850px) {
            .split-screen { flex-direction: column; overflow-y: auto; }
            .left-side { min-height: 250px; }
            .right-side { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="split-screen">
        <div class="left-side">
            <div class="left-content">
                <h1>Elderly Care Portal</h1>
                <p>Dedicated tools for professional caregivers.</p>
            </div>
        </div>

        <div class="right-side">
            <div class="login-container">
                <div class="login-header">
                    <h2>Sign In</h2>
                </div>

                <form action="/myapp/login_get/" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username"  required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"  required>
                    </div>

                    <div class="options-bar">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#" style="color: #3b82f6; text-decoration: none;">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-button">Login to Dashboard</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
