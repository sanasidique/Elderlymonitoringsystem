<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Reply</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .reply-card { background: white; width: 100%; max-width: 550px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        h2 { color: #1f2937; margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; }

        .info-summary { background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #d1d5db; font-size: 0.9rem; color: #4b5563; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
        }
        textarea:focus { outline: none; border-color: #2563eb; ring: 2px solid #bfdbfe; }

        /* Centering the button container */
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-send {
            background-color: #2563eb;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="reply-card">
    <h2>Send Reply to User</h2>

    <div class="info-summary">
    </div>

    <form action="/myapp/send_reply_post/" method="POST">
        <div class="form-group">
            <label for="reply">Your Message</label>
            <textarea id="reply" name="reply" placeholder="Type your response here..." required></textarea>
        </div>

        <div class="button-container">
            <button type="submit" class="btn-send">Send Reply</button>
        </div>
    </form>
</div>

</body>
</html>
