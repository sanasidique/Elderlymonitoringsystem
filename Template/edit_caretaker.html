<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Caretaker Profile</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-submit {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #45a049;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #4CAF50;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Caretaker</h2>

    <form id="caretakerForm" action="/myapp/edit_caretaker_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Existing Photo Preview -->
        <div class="form-group">
            <label>Current Profile Photo</label><br>
            {% if data.image %}
                <img src="{{ data.image.url }}" class="profile-img">
            {% else %}
                <p>No photo uploaded</p>
            {% endif %}
        </div>

        <!-- Upload New Photo -->
        <div class="form-group">
            <label for="photo">Change Photo</label>
            <input type="file" id="photo" name="image" accept="image/*">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ data.name }}" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select</option>
                    <option value="male" {% if data.gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if data.gender == 'female' %}selected{% endif %}>Female</option>
                    <option value="other" {% if data.gender == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" value="{{ data.dob|date:'Y-m-d' }}" required>
            </div>

            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" value="{{ data.qualification }}">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ data.email }}" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" value="{{ data.phone }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="active" {% if data.status == 'active' %}selected{% endif %}>Active</option>
                <option value="inactive" {% if data.status == 'inactive' %}selected{% endif %}>Inactive</option>
                <option value="on_leave" {% if data.status == 'on_leave' %}selected{% endif %}>On Leave</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Update Caretaker</button>
    </form>
</div>

<script>
    document.getElementById('caretakerForm').addEventListener('submit', function () {
        alert('Caretaker profile updated successfully!');
    });
</script>

</body>
</html>
