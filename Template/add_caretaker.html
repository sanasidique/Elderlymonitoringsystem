<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System | Add Caretaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        header { margin-bottom: 30px; text-align: center; }
        h2 { font-size: 1.75rem; color: var(--text); }
        p { color: #64748b; margin-top: 5px; }

        /* Photo Upload Section Style */
        .photo-upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        .profile-preview-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--white);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .placeholder-icon { font-size: 40px; color: #94a3b8; }

        .upload-controls { text-align: center; }
        .upload-controls label {
            display: inline-block;
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        #photo { display: none; } /* Hide actual input */

        /* Form Grid Logic */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .section-divider {
            grid-column: span 2;
            margin: 20px 0 10px;
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .btn-submit {
            grid-column: span 2;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .section-divider { grid-column: span 1; }
            .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Caretaker Registration</h2>
        <p>Complete the profile details below</p>
    </header>

    <form action="/myapp/add_caretaker_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="photo-upload-section">
            <div class="profile-preview-container" id="profile-container">
                <span class="placeholder-icon" id="placeholder">👤</span>
                <img id="preview-img" src="" alt="Preview">
            </div>
            <div class="upload-controls">
                <label for="photo">Choose Profile Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*" onchange="previewImage(event)">
                <p style="font-size: 0.75rem; margin-top: 8px;">JPG, PNG or GIF (Max 2MB)</p>
            </div>
        </div>

        <div class="form-grid">
            <div class="section-divider">Basic Information</div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" placeholder="e.g. B.Sc Nursing">
            </div>

            <div class="section-divider">Contact & Status</div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="email@domain.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+1 234 567 890" required>
            </div>

            <div class="form-group full-width">
                <label>Employment Status</label>
                <select name="status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <div class="section-divider">Security</div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">Add Caretaker to System</button>
        </div>
    </form>
</div>

<script>
    // Live Image Preview Function
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('preview-img');
            const placeholder = document.getElementById('placeholder');
            output.src = reader.result;
            output.style.display = 'block';
            placeholder.style.display = 'none';
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    document.getElementById('caretakerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Caretaker account has been successfully created!');
    });
</script>

</body>
</html>
